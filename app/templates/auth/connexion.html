{% extends "base.html" %}
{% block titre %}Connexion - Covoiturage Faculté{% endblock %}
{% block contenu %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card"><div class="card-body">
      <h2 class="h4 mb-3">Connexion</h2>
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3"><label class="form-label">E-mail</label>
          <input class="form-control" type="email" name="email" required></div>
        <div class="mb-3"><label class="form-label">Mot de passe</label>
          <input class="form-control" type="password" name="mot_de_passe" required></div>
        <button class="btn btn-primary w-100" type="submit">Se connecter</button>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
